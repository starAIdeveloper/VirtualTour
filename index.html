<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#031420" />
    <title>VirtualTour Studio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <dialog id="modal"></dialog>
    <div id="toast" role="status"></div>
    <input
      id="panorama-upload"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      hidden
    /><input
      id="source-upload"
      type="file"
      accept="image/png,image/jpeg,image/webp"
      multiple
      hidden
    /><input id="project-upload" type="file" accept="application/json" hidden />
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
